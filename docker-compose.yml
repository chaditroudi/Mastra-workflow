# Spin up the full stack:
#   docker compose up --build
#
# Mongo runs as a single-node replica set so transactions work. The init
# container runs `rs.initiate()` once after the daemon is reachable and exits.
services:
  mongo:
    image: mongo:7
    container_name: mastra-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Healthy as soon as it accepts a ping — replica-set state is set up by
      # the `mongo-init` service below.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    container_name: mastra-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        # Initiate the replica set if it isn't already.
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initialized");
          } catch (e) {
            print("initiating replica set");
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
        '

  app:
    build: .
    container_name: mastra-app
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      - MONGODB_DB_PREFIX=app
      - TENANCY_STRATEGY=${TENANCY_STRATEGY:-shared}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "3000:3000"

volumes:
  mongo-data:
